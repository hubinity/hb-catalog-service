name: contracts-subtree-staleness

# Warns (never fails) when the vendored platform-shared-contracts/ subtree
# (see docs/adr/0012-vendor-contracts-via-git-subtree.md) has drifted from
# upstream. Run `git subtree pull --prefix platform-shared-contracts
# https://github.com/hubinity/platform-shared-contracts.git <branch> --squash`
# to update.
on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare vendored SHA against upstream HEAD
        run: |
          VENDORED=$(git log -1 --grep="^Squashed 'platform-shared-contracts/'" --format=%B -- platform-shared-contracts | grep -oE '[0-9a-f]{7,40}' | tail -1)
          REMOTE=$(git ls-remote https://github.com/hubinity/platform-shared-contracts.git feature/stock-balance-path | cut -f1)
          echo "vendored=$VENDORED remote=$REMOTE"
          if [ -z "$VENDORED" ] || [ "$VENDORED" != "${REMOTE:0:${#VENDORED}}" ]; then
            echo "::warning::platform-shared-contracts subtree is stale (vendored $VENDORED, upstream HEAD $REMOTE) — run 'git subtree pull' (see docs/adr/0012)"
          fi
